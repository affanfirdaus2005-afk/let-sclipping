<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Clipper — Unduh Video TikTok, YouTube, Instagram</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6c5ce7;
    --accent2: #00d2a0;
    --text: #eef0f4;
    --muted: #8b93a7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0f1115, #171a2b);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub { color: var(--muted); margin-top: 0; font-size: 0.9rem; }
  .input-row { display: flex; gap: 8px; margin-top: 20px; }
  input[type=text] {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #2a2f3d;
    background: #0f1218;
    color: var(--text);
    font-size: 0.95rem;
  }
  button {
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0f1115;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .result { margin-top: 24px; display: none; }
  .result img { width: 100%; border-radius: 12px; }
  .result h3 { margin: 12px 0 4px; font-size: 1.05rem; }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .formats { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .fmt {
    display: flex; justify-content: space-between; align-items: center;
    background: #0f1218; padding: 10px 14px; border-radius: 10px;
    border: 1px solid #23283a;
  }
  .fmt a { color: var(--accent2); text-decoration: none; font-weight: 600; font-size: 0.85rem; }
  .error { color: #ff6b6b; margin-top: 16px; font-size: 0.9rem; display: none; }
  .footer-note { margin-top: 20px; font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>
  <div class="card">
    <h1>Video Clipper</h1>
    <p class="sub">Tempel link TikTok, YouTube, atau Instagram di bawah ini.</p>

    <div class="input-row">
      <input type="text" id="videoUrl" placeholder="https://...">
      <button id="btnFetch">Ambil</button>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="result" id="resultBox">
      <img id="thumb" src="" alt="thumbnail">
      <h3 id="title"></h3>
      <div class="meta" id="meta"></div>
      <div class="formats" id="formats"></div>
    </div>

    <div class="footer-note">
      Gunakan hanya untuk video yang kamu punya hak/izinnya. Layanan ini memakai
      library open-source (yt-dlp) dan tidak berafiliasi dengan TikTok, YouTube,
      atau Instagram.
    </div>
  </div>

<script>
  // Ganti dengan URL backend kamu setelah di-deploy, misal:
  // "https://video-clipper-backend.onrender.com"
  const BACKEND_URL = "http://localhost:5000";

  const btn = document.getElementById("btnFetch");
  const input = document.getElementById("videoUrl");
  const resultBox = document.getElementById("resultBox");
  const errorBox = document.getElementById("errorBox");

  btn.addEventListener("click", async () => {
    const url = input.value.trim();
    errorBox.style.display = "none";
    resultBox.style.display = "none";

    if (!url) {
      errorBox.textContent = "Masukkan link video dulu.";
      errorBox.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Memproses...";

    try {
      const res = await fetch(`${BACKEND_URL}/api/extract`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Terjadi kesalahan.");
      }

      document.getElementById("thumb").src = data.thumbnail || "";
      document.getElementById("title").textContent = data.title || "Tanpa judul";
      document.getElementById("meta").textContent =
        `${data.platform || "-"} • ${data.duration ? data.duration + " detik" : "-"}`;

      const formatsEl = document.getElementById("formats");
      formatsEl.innerHTML = "";

      const list = (data.formats && data.formats.length) ? data.formats : (data.direct_url ? [{ ext: "mp4", resolution: "default", url: data.direct_url }] : []);

      if (list.length === 0) {
        formatsEl.innerHTML = "<div class='meta'>Tidak ada link unduhan yang ditemukan.</div>";
      } else {
        list.forEach((f) => {
          const row = document.createElement("div");
          row.className = "fmt";
          row.innerHTML = `<span>${f.resolution || "?"} · .${f.ext}</span>
                            <a href="${f.url}" target="_blank" rel="noopener">Unduh</a>`;
          formatsEl.appendChild(row);
        });
      }

      resultBox.style.display = "block";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "Ambil";
    }
  });
</script>
</body>
</html>
